version: '1.0'
proposito: Dicionário determinístico de intenção operacional para causa raiz padrão
  e classificação oficial.
fonte_principal: data/input/plano_n2_template.xlsx; colunas históricas comparadas
  com Plano de ação - Chamados Fila N2 - Oficial (4).xlsx.
registros_analisados: 409
classes_permitidas:
- Cancelamento e Reemissão de Nota Fiscal
- Cobrança e Contestação
- Pagamentos, Boletos e Recebimentos
- Contratos, Comercial e Cadastro
- Atendimento Administrativo e Suporte
- Faturamento e Obrigações Fiscais
principio:
- A classificação decorre da intenção e da causa padrão, nunca de score ou quantidade
  de termos.
- Regras conceituais representam relações reutilizáveis entre ação, objeto e contexto;
  padrões legados permanecem como fallback.
- Ações conceituais devem representar pedido ou atuação explícita; ocorrências passivas
  ou meramente contextuais não bastam sozinhas.
- Ação + objeto é a relação padrão para pedidos operacionais; contexto só complementa
  a decisão.
- Objeto + contexto só classifica quando a combinação representa uma situação inequívoca
  prevista pelo dicionário.
- 'O histórico é evidência, não verdade absoluta: conflitos e rótulos genéricos ficam
  explícitos.'
- Sem intenção única, não preencher causa padrão nem classificação automaticamente.
precedencia:
- preferir: INT_NF_CANCEL_REEMISSAO
  sobre:
  - INT_COB_CONTESTACAO
  - INT_COB_DUPLICIDADE
  - INT_COB_SETUP
  - INT_COB_ESTORNO
  - INT_COB_INADIMPLENCIA
  - INT_FAT_CORRECAO_PO
  quando: Há pedido explícito de cancelar, substituir ou reemitir NF; cobrança, contrato,
    CNPJ, desconto e PO podem ser contexto.
- preferir: INT_NF_CANCEL_REEMISSAO
  sobre:
  - INT_PAG_BOLETO_CANCELAMENTO
  quando: Há pedido explícito de cancelar/anular/substituir/reemitir NF; baixa ou
    cancelamento do boleto é consequência/contexto do mesmo pedido.
- preferir: INT_PAG_VENCIMENTO
  sobre:
  - INT_PAG_BOLETO_REENVIO
  - INT_PAG_FINANCEIRO
  quando: O pedido é mudar a data/prazo; reenviar boleto é só o meio.
- preferir: INT_NF_REEMISSAO_PO
  sobre:
  - INT_NF_CANCEL_REEMISSAO
  - INT_FAT_CORRECAO_PO
  quando: A ação é substituir/reemitir a NF e incluir PO no mesmo pedido.
- preferir: INT_PAG_NF_VINCULADA
  sobre:
  - INT_FAT_REENVIO_NF
  quando: O boleto está em aberto e o pedido é receber a NF associada para efetuar
    o pagamento.
- preferir: INT_FAT_CORRECAO_PO
  sobre:
  - INT_COB_CONTESTACAO
  quando: Há pedido explícito de corrigir o descritivo/dado fiscal da NF ou carta
    de correção com PO.
- preferir: INT_PAG_BOLETO_CANCELAMENTO
  sobre:
  - INT_COB_DUPLICIDADE
  quando: A ação é retirar/baixar um boleto duplicado no banco.
- preferir: INT_NF_CANCEL_REEMISSAO
  sobre:
  - INT_FAT_REENVIO_NF
  quando: Pede cancelar e emitir nova NF, não apenas reenviar.
- preferir: INT_CON_CONGELAMENTO
  sobre:
  - INT_NF_CANCEL_REEMISSAO
  quando: Pede congelar/suspender o contrato; cancelamento de NF é só contexto.
