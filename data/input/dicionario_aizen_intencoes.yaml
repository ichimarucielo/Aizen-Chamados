regras_de_nao_classificacao:
- Não classificar por palavra isolada, score ou quantidade de termos.
- Conceitos precisam participar de uma regra conceitual válida; objeto ou contexto
  isolado não classifica.
- Ação + objeto é a combinação padrão para pedidos operacionais.
- Objeto + contexto só classifica quando a combinação representa uma situação inequívoca
  já prevista pelo dicionário.
- Não usar assunto quando Descrição detalhada estiver preenchida.
- Não usar Outros como intenção automática.
- Não inferir classificação para descrição vazia ou conflito sem precedência documentada.
- Não criar classe fora das seis classes permitidas.
